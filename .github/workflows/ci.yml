name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: QML security checks
        run: python3 -m unittest discover -s tests -v
      - name: Plugin manifest
        run: python3 -c "import json; json.load(open('manifest.json'))"

  codeql:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions

  shellcheck:
    name: ShellCheck (embedded commands)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The QML runs a few `bash -c` scripts; extract and lint each one.
      - name: ShellCheck the bash -c scripts in Taskbar.qml
        run: python3 tests/extract_shell.py build/shell && shellcheck --severity=warning build/shell/*.sh

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        run: pipx run zizmor==1.31.1 --offline --min-severity=medium .github/workflows

