name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches manifest version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(jq -er .version manifest.json)"
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "Tag $TAG_NAME does not match manifest version $version" >&2
            exit 1
          fi
      - name: Extract release notes from CHANGELOG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG_NAME" '
            /^## / { if (found) exit; split($0, a, " "); if (a[2] == tag) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "No CHANGELOG section for $TAG_NAME" >&2
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
